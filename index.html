function toggleTheme() {
    const currentTheme = document.body.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', newTheme);
    document.getElementById('btn-theme-toggle').innerText = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
}

function launchSimulator() {
    document.getElementById('landing-page').style.display = 'none';
    document.getElementById('simulator-app').style.display = 'block';
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function formatTime(totalSeconds) {
    let mins = Math.floor(totalSeconds / 60);
    let secs = totalSeconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function startTimer() {
    secondsElapsed = 0;
    document.getElementById('exam-timer').innerText = `⏱️ ${formatTime(secondsElapsed)}`;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById('exam-timer').innerText = `⏱️ ${formatTime(secondsElapsed)}`;
    }, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
}

function updateDashboardStats() {
    document.getElementById('stat-attempts').innerText = attemptsHistory.length;
    if (attemptsHistory.length > 0) {
        let sum = attemptsHistory.reduce((acc, curr) => acc + curr.pct, 0);
        let avg = Math.round(sum / attemptsHistory.length);
        let best = Math.max(...attemptsHistory.map(a => a.pct));
        document.getElementById('stat-avg-score').innerText = `${avg}%`;
        document.getElementById('stat-best-score').innerText = `${best}%`;
    } else {
        document.getElementById('stat-avg-score').innerText = '0%';
        document.getElementById('stat-best-score').innerText = '0%';
    }

    const lbSection = document.getElementById('leaderboard-section');
    const hasJoinedLb = localStorage.getItem('iso_joined_leaderboard') === 'true';

    if (hasJoinedLb) {
        lbSection.style.display = 'block';
        fetchLiveLeaderboard();
    } else {
        lbSection.style.display = 'none';
    }

    const tbody = document.getElementById('history-tbody');
    tbody.innerHTML = '';
    attemptsHistory.slice().reverse().forEach((att, idx) => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${attemptsHistory.length - idx}</td>
            <td><strong>${att.traineeName || 'N/A'}</strong></td>
            <td>${att.timestamp}</td>
            <td>${att.lang === 'ar' ? 'العربية' : 'English'}</td>
            <td><strong>${att.timeTaken || '00:00'}</strong></td>
            <td>${att.score} / ${att.total}</td>
            <td><strong>${att.pct}%</strong></td>
        `;
        tbody.appendChild(tr);
    });
}

function fetchLiveLeaderboard() {
    const tbody = document.getElementById('leaderboard-tbody');
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">⌛ Loading Live Leaderboard...</td></tr>`;

    if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "YOUR_WEB_APP_URL_HERE") {
        fetch(GOOGLE_SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                if (data.status === "success" && data.leaderboard) {
                    renderLeaderboard(data.leaderboard);
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No entries yet.</td></tr>`;
                }
            })
            .catch(err => {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Unable to load public leaderboard.</td></tr>`;
            });
    } else {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Live Leaderboard URL not configured.</td></tr>`;
    }
}

function renderLeaderboard(list) {
    const tbody = document.getElementById('leaderboard-tbody');
    tbody.innerHTML = '';

    if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No entries yet.</td></tr>`;
        return;
    }

    list.slice(0, 10).forEach((item, idx) => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight:700; color:${idx === 0 ? 'var(--gold)' : 'inherit'}">${idx === 0 ? '🥇 #1' : (idx === 1 ? '🥈 #2' : (idx === 2 ? '🥉 #3' : `#${idx+1}`))}</td>
            <td><strong>${item.name}</strong></td>
            <td><strong>${item.pct}%</strong></td>
        `;
        tbody.appendChild(tr);
    });
}

function shuffle(array) {
    if (!array || !Array.isArray(array)) return [];
    let arr = JSON.parse(JSON.stringify(array));
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startExam() {
    let nameInput = document.getElementById('input-trainee').value.trim();
    if (!nameInput) {
        alert(currentLang === 'ar' ? 'يرجى إدخال اسم المتدرب أولاً!' : 'Please enter trainee name first!');
        return;
    }

    let bankLen = getAvailableBankLength();
    if (bankLen === 0) {
        alert(currentLang === 'ar' 
            ? 'خطأ: لم يتم تحميل أسئلة الاختبار (questions.js غير موجود أو يحتوي على أخطاء برمجية)!' 
            : 'Error: questions.js is not loaded or contains syntax errors!');
        return;
    }

    currentTrainee = nameInput;
    joinLeaderboard = document.getElementById('chk-leaderboard').checked;
    localStorage.setItem('iso_joined_leaderboard', joinLeaderboard ? 'true' : 'false');

    let countInput = parseInt(document.getElementById('input-qcount').value) || 10;
    let count = Math.min(Math.max(countInput, 1), bankLen);

    let shuffledBank = shuffle(questionBank);
    activeQuestions = shuffledBank.slice(0, count);
    userAnswers = {};
    currentPage = 1;

    document.getElementById('dashboard-view').style.display = 'none';
    document.getElementById('exam-screen').style.display = 'block';

    startTimer();
    renderExamQuestions();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderExamQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    let totalPages = Math.ceil(activeQuestions.length / PAGE_SIZE);
    let startIndex = (currentPage - 1) * PAGE_SIZE;
    let endIndex = Math.min(startIndex + PAGE_SIZE, activeQuestions.length);

    document.getElementById('exam-progress-title').innerText = `${currentLang === 'ar' ? 'الأسئلة' : 'Questions'} ${startIndex + 1} - ${endIndex} ${currentLang === 'ar' ? 'من' : 'of'} ${activeQuestions.length}`;

    for (let idx = startIndex; idx < endIndex; idx++) {
        let q = activeQuestions[idx];
        let data = q[currentLang];
        let card = document.createElement('div');
        card.className = 'question-card';

        let optsWithIndex = data.opts.map((opt, i) => ({ text: opt, originalIdx: i }));
        let shuffledOpts = shuffle(optsWithIndex);

        let optsHtml = `
            <div class="options-list">
                ${shuffledOpts.map(o => `
                    <label class="option-item">
                        <input type="radio" name="q_${idx}" value="${o.originalIdx}" ${userAnswers[idx] === o.originalIdx ? 'checked' : ''} onchange="userAnswers[${idx}]=${o.originalIdx}">
                        ${o.text}
                    </label>
                `).join('')}
            </div>
        `;

        card.innerHTML = `
            <div class="q-header">
                <span class="badge">Q${idx + 1} / ${activeQuestions.length}</span>
                <span class="ref-tag">${q.ref}</span>
            </div>
            <div style="font-weight:700; font-size:1.05em; margin-bottom:12px; line-height:1.5;">${data.q}</div>
            ${optsHtml}
        `;
        container.appendChild(card);
    }

    const pageIndicator = document.getElementById('page-indicator');
    pageIndicator.innerText = `${currentLang === 'ar' ? 'صفحة' : 'Page'} ${currentPage} ${currentLang === 'ar' ? 'من' : 'of'} ${totalPages}`;

    document.getElementById('btn-prev-page').style.visibility = currentPage === 1 ? 'hidden' : 'visible';
    document.getElementById('btn-next-page').style.visibility = currentPage === totalPages ? 'hidden' : 'visible';

    document.getElementById('pagination-controls').style.display = activeQuestions.length > PAGE_SIZE ? 'flex' : 'none';
    document.getElementById('btn-submit').style.display = currentPage === totalPages ? 'block' : 'none';
}

function changePage(direction) {
    let totalPages = Math.ceil(activeQuestions.length / PAGE_SIZE);
    currentPage += direction;
    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages) currentPage = totalPages;

    renderExamQuestions();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function exitExam() {
    stopTimer();
    document.getElementById('exam-screen').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
}

function submitExam() {
    stopTimer();
    let finalTimeStr = formatTime(secondsElapsed);

    let score = 0;
    activeQuestions.forEach((q, idx) => {
        let selected = userAnswers[idx];
        if (selected !== undefined && selected === q[currentLang].ans) {
            score++;
        }
    });

    let pct = Math.round((score / activeQuestions.length) * 100);
    let now = new Date();
    let timeStr = now.toLocaleString(currentLang === 'ar' ? 'ar-EG' : 'en-US');

    let newAttempt = {
        traineeName: currentTrainee,
        timestamp: timeStr,
        lang: currentLang,
        timeTaken: finalTimeStr,
        score: score,
        total: activeQuestions.length,
        pct: pct,
        consent: joinLeaderboard
    };

    attemptsHistory.push(newAttempt);
    localStorage.setItem('iso_attempts_history', JSON.stringify(attemptsHistory));

    if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "YOUR_WEB_APP_URL_HERE") {
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newAttempt)
        }).catch(err => console.log('Syncing error:', err));
    }

    showResultScreen(score, pct, finalTimeStr);
}

function showResultScreen(score, pct, timeTakenStr) {
    document.getElementById('exam-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    document.getElementById('res-trainee-name').innerText = `${currentLang === 'ar' ? 'المتدرب:' : 'Trainee:'} ${currentTrainee}`;
    document.getElementById('res-score').innerText = `${score} / ${activeQuestions.length} (${pct}%)`;
    document.getElementById('res-time-taken').innerText = `⏱️ ${currentLang === 'ar' ? 'المدة المستغرقة:' : 'Time Taken:'} ${timeTakenStr}`;
    
    let feedback = '';
    if (pct >= 85) feedback = currentLang === 'ar' ? 'أداء ممتاز جداً! أنت جاهز لاجتياز الامتحان بنجاح 🎯' : 'Excellent performance! You are fully ready for the exam 🎯';
    else if (pct >= 70) feedback = currentLang === 'ar' ? 'أداء جيد! يرجى مراجعة النقاط الخاطئة لضمان الدرجة النهائية 👍' : 'Good effort! Review incorrect answers for perfection 👍';
    else feedback = currentLang === 'ar' ? 'يحتاج إلى مزيد من المراجعة للبناء المعياري والضوابط 📚' : 'Needs more review of clauses and controls 📚';
    
    document.getElementById('res-feedback').innerText = feedback;

    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '<h3>' + (currentLang === 'ar' ? 'تفاصيل المراجعة والتعليل المعياري:' : 'Detailed Review & References:') + '</h3>';

    activeQuestions.forEach((q, idx) => {
        let data = q[currentLang];
        let userAns = userAnswers[idx];
        let isCorrect = userAns === data.ans;

        let userText = userAns !== undefined ? data.opts[userAns] : (currentLang === 'ar' ? 'لم تجب' : 'Not answered');
        let correctText = data.opts[data.ans];

        let box = document.createElement('div');
        box.style.cssText = "background:var(--bg-card); padding:16px; border-radius:12px; margin-bottom:12px; border:1px solid var(--border-color); font-size:0.95em;";
        box.innerHTML = `
            <div><strong>Q${idx + 1}: ${data.q}</strong></div>
            <div style="margin:8px 0;">
                <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}; font-weight:700;">
                    ${currentLang === 'ar' ? 'إجابتك:' : 'Your answer:'} ${userText}
                </span>
                ${!isCorrect ? `<br><span style="color:var(--success); font-weight:700;">${currentLang === 'ar' ? 'الإجابة الصحيحة:' : 'Correct answer:'} ${correctText}</span>` : ''}
            </div>
            <div class="explanation-box">
                <span class="ref-tag">📌 Reference: ${q.ref}</span><br>
                💡 ${data.exp}
            </div>
        `;
        reviewContainer.appendChild(box);
    });

    window.scrollTo({top: 0, behavior: 'smooth'});
}

function showDashboard() {
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
    updateDashboardStats();
}

function clearLocalHistory() {
    let confirmMsg = currentLang === 'ar' 
        ? 'هل أنت تأكد من رغبتك في مسح سجل المحاولات المحلي الخاص بك من هذا المتصفح؟' 
        : 'Are you sure you want to clear your local attempt history from this browser?';
    
    if (confirm(confirmMsg)) {
        attemptsHistory = [];
        localStorage.removeItem('iso_attempts_history');
        localStorage.removeItem('iso_joined_leaderboard');
        updateDashboardStats();
    }
}

window.onload = () => {
    let bankLen = getAvailableBankLength();
    const qInput = document.getElementById('input-qcount');
    if (qInput && bankLen > 0) {
        qInput.max = bankLen;
    }
    updateDashboardStats();
};
